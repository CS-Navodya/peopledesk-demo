<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PeopleDesk (Training Demo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: Arial, sans-serif; max-width: 780px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { margin-bottom: 0; }
  .banner { background: #fff3cd; border: 1px solid #ffe69c; padding: 10px 14px; border-radius: 6px; font-size: 14px; margin: 12px 0 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
  form { margin-top: 24px; display: grid; gap: 8px; max-width: 420px; }
  input, button { padding: 8px; font-size: 14px; }
  button { cursor: pointer; }
  section { margin-top: 36px; }
</style>
</head>
<body>
  <h1>PeopleDesk</h1>
  <div class="banner">Training demo only — intentionally insecure, no real customer data. See README.md.</div>

  <section>
    <h2>Support tickets</h2>
    <p>Note: this list loads with no login required.</p>
    <table id="ticketTable">
      <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Issue</th><th>Notes</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>New ticket</h2>
    <form id="ticketForm">
      <input name="name" placeholder="Full name" required />
      <input name="email" placeholder="Email" required />
      <input name="phone" placeholder="Phone" />
      <input name="issue" placeholder="Issue" required />
      <input name="notes" placeholder="Notes" />
      <button type="submit">Submit ticket</button>
    </form>
  </section>

  <section>
    <h2>Admin login</h2>
    <form id="loginForm">
      <input name="username" placeholder="Username" />
      <input name="password" type="password" placeholder="Password" />
      <button type="submit">Log in</button>
    </form>
    <p id="loginResult"></p>
  </section>

<script>
async function loadTickets() {
  const res = await fetch('/api/tickets');
  const tickets = await res.json();
  const tbody = document.querySelector('#ticketTable tbody');
  tbody.innerHTML = '';
  for (const t of tickets) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${t.name}</td><td>${t.email}</td><td>${t.phone||''}</td><td>${t.issue}</td><td>${t.notes||''}</td>`;
    tbody.appendChild(tr);
  }
}

document.getElementById('ticketForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  await fetch('/api/tickets', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  e.target.reset();
  loadTickets();
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  const body = await res.json();
  document.getElementById('loginResult').textContent = body.ok ? 'Logged in.' : 'Login failed.';
});

loadTickets();
</script>
</body>
</html>
